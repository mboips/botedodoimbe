<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boteco do Imbé</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a09;--s1:#141210;--s2:#1c1916;--ln:#2d2822;--tx:#f1ebe1;--mu:#8f8678;--gd:#d9a441;--gd2:#f2cf85;--ok:#7bc08a;--bad:#e0705a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 Manrope,system-ui,sans-serif;min-height:100vh}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{position:relative;overflow:hidden;background:radial-gradient(900px 600px at 30% 60%,#2a1d0c,var(--bg) 70%);border-right:1px solid var(--ln)}
.hero svg.bg{position:absolute;inset:0;width:100%;height:100%}
.ring{transform-origin:50% 50%;animation:spin 60s linear infinite}.ring.r2{animation-duration:90s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.scan{animation:scan 7s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateY(0);opacity:0}10%,90%{opacity:.7}50%{transform:translateY(520px)}}
.hero .cap{position:absolute;left:48px;bottom:44px;right:48px}
.hero .cap small{letter-spacing:.32em;text-transform:uppercase;color:var(--gd);font-size:11px}
.hero .cap h1{font-size:64px;line-height:.95;margin-top:10px;font-weight:600}
.hero .cap h1 em{color:var(--gd);font-style:italic}
.lp{display:grid;place-items:center;padding:32px}
.card{width:100%;max-width:380px}
.mono{display:flex;align-items:center;gap:12px;margin-bottom:34px}
.mono b{width:42px;height:42px;border:1px solid var(--gd);display:grid;place-items:center;color:var(--gd);font-size:22px;transform:rotate(45deg);border-radius:6px}
.mono b i{transform:rotate(-45deg);font-style:normal}
.card h2{font-size:34px;font-weight:600}
.card p{color:var(--mu);margin:6px 0 26px}
.fld{position:relative;margin-bottom:14px}
.fld label{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);margin-bottom:7px}
.inp{width:100%;background:var(--s1);border:1px solid var(--ln);border-radius:10px;padding:13px 14px;outline:0;transition:.2s}
.inp:focus{border-color:var(--gd);box-shadow:0 0 0 4px #d9a44118}
.eye{position:absolute;right:10px;bottom:9px;color:var(--mu);font-size:12px;padding:4px 8px}
.btn{background:linear-gradient(180deg,var(--gd2),var(--gd));color:#1a1206;font-weight:700;border-radius:10px;padding:13px 18px;transition:.2s;letter-spacing:.03em}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--ln)}
.btn.ghost:hover{border-color:var(--gd);color:var(--gd2)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.err{color:var(--bad);font-size:13px;min-height:20px;margin-top:10px}
.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.foot{margin-top:30px;color:var(--mu);font-size:12px;display:flex;gap:8px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
/* app */
#app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
aside{background:var(--s1);border-right:1px solid var(--ln);padding:26px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
aside .mono{margin:0 6px 30px}aside .mono b{width:34px;height:34px;font-size:17px}
aside .nm{font-size:22px;line-height:1;font-weight:600}aside .nm small{display:block;font:600 9px Manrope;letter-spacing:.3em;color:var(--gd);margin-bottom:3px}
nav{display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--mu);text-align:left;font-weight:500;transition:.2s}
nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
nav button:hover{color:var(--tx);background:var(--s2)}
nav button.on{background:linear-gradient(90deg,#d9a44124,transparent);color:var(--gd2);box-shadow:inset 2px 0 var(--gd)}
.sp{flex:1}
main{padding:34px 40px 60px;max-width:1400px;width:100%}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.hd h2{font-size:40px;font-weight:600;line-height:1}
.hd p{color:var(--mu);margin-top:6px}
.pan{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:20px}
.pan h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);font-weight:600;margin-bottom:16px;display:flex;justify-content:space-between}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.kp .pan{position:relative;overflow:hidden}
.kp .pan:after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(#d9a44122,transparent 70%)}
.kp b{display:block;font-size:30px;font-family:'Cormorant Garamond',serif;font-weight:700;color:var(--gd2);line-height:1.1}
.kp span{font-size:12px;color:var(--mu)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.seg{display:inline-flex;background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:9px;color:var(--mu);font-weight:600;font-size:13px}
.seg button.on{background:var(--gd);color:#1a1206}
.flt{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.flt .inp{width:auto;padding:9px 12px}
.rk{display:flex;flex-direction:column;gap:11px}
.rk div.r{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;font-size:13px}
.rk i{font-style:normal;color:var(--mu);font-size:12px}
.rk .bar{height:5px;background:var(--s2);border-radius:5px;margin-top:5px;overflow:hidden}
.rk .bar u{display:block;height:100%;background:linear-gradient(90deg,var(--gd),var(--gd2));border-radius:5px}
.rk.low .bar u{background:linear-gradient(90deg,#8a5a3c,var(--bad))}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);text-align:left;padding:10px;border-bottom:1px solid var(--ln);font-weight:600}
td{padding:13px 10px;border-bottom:1px solid #201c17}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--s2)}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--ln);color:var(--gd2)}
.ov{overflow-x:auto}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.pc{background:var(--s1);border:1px solid var(--ln);border-radius:14px;overflow:hidden;text-align:left;transition:.2s;position:relative}
.pc:hover{border-color:var(--gd);transform:translateY(-2px)}
.pc .art{height:104px;display:grid;place-items:center}
.pc .art svg{height:74px;filter:drop-shadow(0 8px 14px #0008)}
.pc .in{padding:11px 13px 13px}
.pc .in b{display:block;font-weight:600;font-size:14px}
.pc .in span{color:var(--mu);font-size:12px}
.pc .pr{color:var(--gd2);font-weight:700;margin-top:4px}
.pc .x{position:absolute;top:8px;right:8px;background:#0009;border-radius:8px;width:26px;height:26px;color:var(--mu);font-size:15px}
.pc .x:hover{color:var(--bad)}
.pos{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
.tabs button{white-space:nowrap;padding:10px 16px;border:1px solid var(--ln);border-radius:12px;background:var(--s1);color:var(--mu);font-weight:600}
.tabs button.on{border-color:var(--gd);color:var(--gd2);background:#d9a4411a}
.tabs button small{display:block;font-weight:500;font-size:11px;color:var(--mu)}
.tk{position:sticky;top:20px}
.li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--ln)}
.li b{font-weight:600;font-size:13px;display:block}.li span{font-size:12px;color:var(--mu)}
.qt{display:flex;align-items:center;gap:8px}
.qt button{width:26px;height:26px;border:1px solid var(--ln);border-radius:8px}
.qt button:hover{border-color:var(--gd);color:var(--gd2)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 14px}
.tot b{font-size:34px;font-family:'Cormorant Garamond',serif;color:var(--gd2)}
.emp{color:var(--mu);text-align:center;padding:34px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chips button{padding:6px 13px;border-radius:20px;border:1px solid var(--ln);color:var(--mu);font-size:12px;font-weight:600}
.chips button.on{background:var(--gd);color:#1a1206;border-color:var(--gd)}
.mod{position:fixed;inset:0;background:#000b;backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;padding:20px}
.mod .box{background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:26px;width:100%;max-width:430px;max-height:90vh;overflow:auto}
.mod h3{font-size:28px;font-weight:600;margin-bottom:18px}
.row{display:flex;gap:10px}.row>*{flex:1}
.dn{width:130px;height:130px;border-radius:50%;margin:auto}
.lg{display:flex;flex-direction:column;gap:8px;font-size:13px;flex:1}
.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:8px}
@media(max-width:900px){
#login{grid-template-columns:1fr}.hero{min-height:230px}.hero .cap h1{font-size:40px}.hero .cap{left:24px;bottom:24px}
#app{grid-template-columns:1fr}
aside{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:40;border-right:0;border-top:1px solid var(--ln)}
aside .mono,aside .sp,aside .out{display:none}nav{flex-direction:row;width:100%;justify-content:space-around}
nav button{flex-direction:column;gap:3px;font-size:11px;padding:8px 6px}
main{padding:22px 16px 110px}.hd h2{font-size:32px}.g2,.pos{grid-template-columns:1fr}.tk{position:static}}

@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pu{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes rise{from{transform:translateY(0);opacity:0}15%{opacity:.7}to{transform:translateY(-780px);opacity:0}}
@keyframes bar{from{transform:scaleY(0)}}
@keyframes wd{from{transform:scaleX(0)}}
.fl{animation:fl 6s ease-in-out infinite}.pu,.dot{animation:pu 3s ease-in-out infinite}
.bub{fill:#f2cf85;opacity:0;animation:rise var(--t,12s) linear infinite}
.card>*{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
.card>:nth-child(2){animation-delay:.08s}.card>:nth-child(3){animation-delay:.16s}.card>:nth-child(4){animation-delay:.24s}.card>:nth-child(5){animation-delay:.32s}.card>:nth-child(6){animation-delay:.4s}.card>:nth-child(7){animation-delay:.48s}
.mono .logo{width:56px;height:56px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px var(--gd),0 0 26px #d9a44144}
aside .mono .logo{width:40px;height:40px}
.vw>*{animation:up .55s cubic-bezier(.2,.7,.2,1) both}.vw>:nth-child(2){animation-delay:.07s}.vw>:nth-child(3){animation-delay:.14s}.vw>:nth-child(4){animation-delay:.21s}.vw>:nth-child(5){animation-delay:.28s}.vw>:nth-child(6){animation-delay:.35s}
.vw .pc,.vw .oc{animation:up .5s cubic-bezier(.2,.7,.2,1) both}
.pan svg rect{transform-box:fill-box;transform-origin:bottom;animation:bar .8s cubic-bezier(.2,.7,.2,1) both}
.rk .bar u{transform-origin:left;animation:wd 1s cubic-bezier(.2,.7,.2,1) both}
.pc .art svg{transition:.35s}.pc:hover .art svg{transform:scale(1.1) rotate(-4deg)}
.btn:active,.pc:active,.oc:active{transform:scale(.97)}
.stats{grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}
.stats .pan{display:flex;flex-direction:column;gap:2px}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:22px}
.oc{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;background:linear-gradient(160deg,var(--s2),var(--s1));border:1px solid var(--ln);border-radius:16px;padding:14px;transition:.25s;position:relative;overflow:hidden}
.oc:hover{transform:translateY(-3px);border-color:#d9a44188}
.oc.on{border-color:var(--gd);box-shadow:0 0 0 1px var(--gd),0 16px 34px -16px #d9a44166}
.oc.on:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gd)}
.av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#d9a44122;color:var(--gd2);font:700 22px 'Cormorant Garamond',serif}
.ot b{display:block}.ot span{font-size:12px;color:var(--mu)}
.oq{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--ln);margin-top:8px;padding-top:9px}
.oq span{font-size:12px;color:var(--mu)}.oq b{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--gd2)}
.sec{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);margin:0 0 10px;font-weight:600}
.fh{display:flex;gap:8px;overflow-x:auto;margin-bottom:24px;padding-bottom:4px}
.fh div{flex:none;background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:8px 14px;font-size:12px;color:var(--mu)}
.fh b{display:block;color:var(--tx);font-size:13px}
.sync{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mu);margin:0 6px 14px}
@media(max-width:900px){aside .sync{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#rcpt{display:none}
@media print{
@page{margin:0}
html,body{background:#fff!important;min-height:0}
body>*:not(#rcpt){display:none!important}
#rcpt{display:block;width:100%;max-width:72mm;margin:0 auto;padding:2mm;color:#000;font:12px/1.35 'Courier New',monospace}
#rcpt h1{font:700 16px 'Courier New',monospace;text-align:center}
#rcpt .c{text-align:center}
#rcpt .l{display:flex;justify-content:space-between;gap:8px}
#rcpt hr{border:0;border-top:1px dashed #000;margin:5px 0}
#rcpt .t{font-weight:700;font-size:15px}
}
</style>
</head>
<body>

<section id="login">
  <div class="hero">
    <svg class="bg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice">
      <defs>
        <radialGradient id="glow"><stop offset="0" stop-color="#d9a441" stop-opacity=".35"/><stop offset="1" stop-color="#d9a441" stop-opacity="0"/></radialGradient>
        <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2cf85" stop-opacity=".95"/><stop offset="1" stop-color="#8a5a1c" stop-opacity=".55"/></linearGradient>
        <pattern id="gr" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d9a441" stroke-opacity=".07"/></pattern>
      </defs>
      <rect width="800" height="800" fill="url(#gr)"/>
      <circle class="pu" cx="400" cy="330" r="260" fill="url(#glow)"/>
      <g class="ring" style="transform-origin:400px 330px"><circle cx="400" cy="330" r="210" fill="none" stroke="#d9a441" stroke-opacity=".35" stroke-dasharray="2 10"/><circle cx="610" cy="330" r="4" fill="#f2cf85"/></g>
      <g class="ring r2" style="transform-origin:400px 330px"><circle cx="400" cy="330" r="270" fill="none" stroke="#d9a441" stroke-opacity=".2"/><circle cx="400" cy="60" r="3" fill="#f2cf85"/></g>
      <clipPath id="lcp"><circle cx="400" cy="330" r="112"/></clipPath><image data-logo class="fl" x="288" y="218" width="224" height="224" clip-path="url(#lcp)"/><circle cx="400" cy="330" r="116" fill="none" stroke="#d9a441" stroke-opacity=".5"/>
      <g class="scan"><rect x="270" y="150" width="260" height="1.5" fill="#f2cf85"/></g>
    </svg>
    <div class="cap"><small>Adega &amp; Lounge</small><h1 class="serif">Boteco<br>do <em>Imbé</em></h1></div>
  </div>
  <div class="lp"><div class="card" id="lc">
    <div class="mono"><img class="logo" data-logo alt="Boteco do Imbé"><span style="font-size:11px;letter-spacing:.3em;color:var(--mu)">SISTEMA INTERNO</span></div>
    <h2 class="serif">Acesso restrito</h2><p>Digite a senha para abrir o painel da casa.</p>
    <div class="fld"><label for="pw">Senha</label><input class="inp" id="pw" type="password" autocomplete="current-password" placeholder="••••••••••••"><button class="eye" id="eye" type="button">mostrar</button></div>
    <button class="btn full" id="go">Entrar</button>
    <div class="err" id="er"></div>
    <div class="foot"><span class="dot"></span>Ambiente seguro · v1.0</div>
  </div></div>
</section>

<section id="app" class="hide">
  <aside>
    <div class="mono"><img class="logo" data-logo alt="Boteco do Imbé"><div class="nm serif"><small>BOTECO DO</small>Imbé</div></div>
    <nav id="nav"></nav>
    <div class="sp"></div><div class="sync"><span class="dot"></span><span id="st">Conectando…</span></div>
    <button class="btn ghost sm out" id="out">Sair</button>
  </aside>
  <main id="main"></main>
</section>

/* helpers */
function range(p){const n=new Date(),d0=new Date(n.getFullYear(),n.getMonth(),n.getDate());
if(p==='hoje')return[+d0,Infinity];
if(p==='semana'){const w=(d0.getDay()+6)%7;return[+d0-w*864e5,Infinity]}
if(p==='mes')return[+new Date(n.getFullYear(),n.getMonth(),1),Infinity];
if(p==='custom'){const a=V.from?+new Date(V.from+'T00:00'):0,b=V.to?+new Date(V.to+'T23:59:59'):Infinity;return[a,b]}
return[0,Infinity]}
const inR=(s,p)=>{const r=range(p);return s.date>=r[0]&&s.date<=r[1]}
const sum=a=>a.reduce((t,s)=>t+s.total,0);
const tot=o=>o.items.reduce((t,i)=>t+i.price*i.qty,0);
const pg=o=>+o.pago||0;
const rest=o=>Math.max(0,tot(o)-pg(o));
const fd=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});

const plain=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'?');
const money=v=>(+v).toFixed(2).replace('.',',');
const pad=(l,r)=>{l=plain(l);r=plain(r);const n=PRN.w-l.length-r.length;return n>0?l+' '.repeat(n)+r:l.slice(0,Math.max(0,PRN.w-r.length-1))+' '+r};
const BTS=['000018f0-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455','0000ffe0-0000-1000-8000-00805f9b34fb','0000ff00-0000-1000-8000-00805f9b34fb','0000fee7-0000-1000-8000-00805f9b34fb'];
function savePrn(){try{localStorage.setItem('imbe_prn',JSON.stringify({mode:PRN.mode,w:PRN.w}))}catch(e){}}
const prnTxt=()=>({bt:'Bluetooth: '+(PRN.dev&&PRN.dev.name||''),usb:'USB conectada',browser:'Impressão do navegador'}[PRN.mode]||'Nenhuma impressora configurada');

function escpos(s){
const B=[],txt=t=>B.push(...enc.encode(plain(t)+'\n')),ln=()=>txt('-'.repeat(PRN.w));
B.push(0x1B,0x40,0x1B,0x61,1,0x1B,0x45,1,0x1D,0x21,0x01);txt('BOTECO DO IMBE');
B.push(0x1D,0x21,0x00,0x1B,0x45,0x00);txt('Adega & Lounge');txt(new Date(s.date).toLocaleString('pt-BR'));
B.push(0x1B,0x61,0);ln();
txt('Cliente: '+s.name);if(s.table)txt('Mesa: '+s.table);ln();
s.items.forEach(i=>{txt(i.name);txt(pad(i.qty+' x '+money(i.price),money(i.qty*i.price)))});
ln();if(s.prev){txt(pad('Total da conta','R$ '+money(s.total+s.prev)));txt(pad('Pago antes','- R$ '+money(s.prev)))}B.push(0x1B,0x45,1,0x1D,0x21,0x01);txt(pad(s.prev?'RESTANTE':'TOTAL','R$ '+money(s.total)));B.push(0x1D,0x21,0x00,0x1B,0x45,0x00);
txt('Pagamento: '+s.pay);
B.push(0x1B,0x61,1);txt('');txt('Obrigado e volte sempre!');B.push(0x1B,0x64,4);
return B}

function browserPrint(s){
let r=$('#rcpt');if(!r){r=document.createElement('div');r.id='rcpt';document.body.appendChild(r)}
r.innerHTML=`<h1>BOTECO DO IMBÉ</h1><div class="c">Adega &amp; Lounge<br>${new Date(s.date).toLocaleString('pt-BR')}</div><hr><div>Cliente: ${esc(s.name)}</div>${s.table?`<div>Mesa: ${esc(s.table)}</div>`:''}<hr>${s.items.map(i=>`<div>${esc(i.name)}</div><div class="l"><span>${i.qty} x ${money(i.price)}</span><span>${money(i.qty*i.price)}</span></div>`).join('')}<hr>${s.prev?`<div class="l"><span>Total da conta</span><span>R$ ${money(s.total+s.prev)}</span></div><div class="l"><span>Pago antes</span><span>- R$ ${money(s.prev)}</span></div>`:''}<div class="l t"><span>${s.prev?'RESTANTE':'TOTAL'}</span><span>R$ ${money(s.total)}</span></div><div>Pagamento: ${esc(s.pay)}</div><hr><div class="c">Obrigado e volte sempre!</div>`;
setTimeout(()=>window.print(),80)}

async function btChar(d){
const srv=await d.gatt.connect();
for(const sv of await srv.getPrimaryServices())for(const c of await sv.getCharacteristics())
 if(c.properties.write||c.properties.writeWithoutResponse)return c;
throw new Error('Esta impressora não aceita escrita por Bluetooth BLE.')}

async function usbOpen(d){
await d.open();if(!d.configuration)await d.selectConfiguration(1);
let pick=null;
for(const i of d.configuration.interfaces)for(const a of i.alternates)for(const ep of a.endpoints)
 if(ep.direction==='out'&&(!pick||(a.interfaceClass===7&&pick.cls!==7)))pick={n:i.interfaceNumber,e:ep.endpointNumber,cls:a.interfaceClass};
if(!pick)throw new Error('Saída USB não encontrada.');
await d.claimInterface(pick.n);PRN.dev=d;PRN.ep=pick.e;PRN.mode='usb'}

async function send(bytes){
const u=new Uint8Array(bytes);
if(PRN.mode==='usb'){await PRN.dev.transferOut(PRN.ep,u);return}
if(!PRN.dev.gatt.connected)PRN.ch=await btChar(PRN.dev);
for(let i=0;i<u.length;i+=100){const p=u.slice(i,i+100);
 PRN.ch.properties.writeWithoutResponse?await PRN.ch.writeValueWithoutResponse(p):await PRN.ch.writeValue(p);
 await new Promise(r=>setTimeout(r,25))}}

async function printSale(s){
try{
 if(PRN.mode==='bt'||PRN.mode==='usb')await send(escpos(s));
 else if(PRN.mode==='browser')browserPrint(s);
}catch(e){alert('Não consegui imprimir direto na impressora ('+(e.message||e)+'). Vou usar a impressão do navegador.');browserPrint(s)}}

function prnModal(){modal(`<h3 class="serif">Impressora</h3><p style="color:var(--mu);margin-bottom:14px">${prnTxt()}</p>
<div style="display:grid;gap:10px"><button class="btn" data-a="prnBT">Conectar por Bluetooth</button><button class="btn" data-a="prnUSB">Conectar por USB</button><button class="btn ghost" data-a="prnBR">Usar impressão do navegador</button></div>
<div class="fld" style="margin-top:16px"><label>Largura do papel</label><select class="inp" onchange="PRN.w=+this.value;savePrn()"><option value="32" ${PRN.w===32?'selected':''}>58 mm</option><option value="48" ${PRN.w===48?'selected':''}>80 mm</option></select></div>
<div class="row"><button class="btn ghost" data-a="mc">Fechar</button><button class="btn" data-a="prnTest">Imprimir teste</button></div>`)}

document.addEventListener('click',async e=>{
const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
try{
 if(a==='prn')prnModal();
 else if(a==='prnBT'){
  if(!navigator.bluetooth)throw new Error('Este navegador não tem Bluetooth web. Use o Chrome no Android ou no computador.');
  const d=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BTS});
  PRN.ch=await btChar(d);PRN.dev=d;PRN.mode='bt';savePrn();prnModal()}
 else if(a==='prnUSB'){
  if(!navigator.usb)throw new Error('Este navegador não tem USB web. Use o Chrome no Android ou no computador.');
  await usbOpen(await navigator.usb.requestDevice({filters:[]}));savePrn();prnModal()}
 else if(a==='prnBR'){PRN.mode='browser';savePrn();prnModal()}
 else if(a==='prnTest')await printSale({name:'TESTE',table:'1',items:[{name:'Item de teste',qty:2,price:5}],total:10,pay:'Pix',date:Date.now()});
 else if(a==='reprint')await printSale(S.sales.find(x=>x.id===b.dataset.id));
}catch(err){if(err.name!=='NotFoundError')alert('Impressora: '+(err.message||err))}});

try{const c=JSON.parse(localStorage.getItem('imbe_prn'));if(c){PRN.w=c.w||32;
 if(c.mode==='browser')PRN.mode='browser';
 if(c.mode==='usb'&&navigator.usb)navigator.usb.getDevices().then(l=>l[0]&&usbOpen(l[0])).catch(()=>{})}}catch(e){}
try{if(sessionStorage.getItem('imbe_ok')==='1')enter()}catch(e){}
</script>
</body>
